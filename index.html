<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Product preview card component</title>
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main class="product-card">
      <div class="product-image">
        <picture>
          <source class="mobile-image"
            srcset="images/image-product-mobile.jpg"
            media="(max-width: 768px)"
          />
          <img class="desktop-image"
            src="images/image-product-desktop.jpg"
            alt="Gabrielle Chanel perfume bottle"
          />
        </picture>
      </div>
      <div class="product-details">
        <p class="category">PERFUME</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p class="description">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="price">
          <strong class="current-price">$149.99</strong>
          <del class="old-price">$169.99</del>
        </div>
        <button class="cart-button" type="button">
          <img src="images/icon-cart.svg" alt="cart icon" />
          <p>Add to Cart</p>
        </button>
      </div>
    </main>
  </body>
</html>
